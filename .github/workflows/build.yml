name: Build AudioSplitter Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install Pillow pyinstaller

    - name: Download and Setup FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
        $ffmpegBin = (Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -ExpandProperty FullName -First 1)
        echo "FFMPEG_PATH=$ffmpegBin" >> $env:GITHUB_ENV

    - name: Build with PyInstaller
      shell: pwsh
      run: |
        $ffmpegPath = $env:FFMPEG_PATH
        Write-Host "Using FFmpeg at: $ffmpegPath"
        pyinstaller --noconfirm --onedir --windowed -n "AudioSplitter" --icon="my_app.ico" --add-binary "$ffmpegPath;." --collect-all torch --collect-all demucs --collect-all sounddevice --noupx app.py

    - name: Compress Output Directory
      shell: pwsh
      run: |
        Compress-Archive -Path "dist\AudioSplitter" -DestinationPath "AudioSplitter-Windows-x64.zip"

    - name: Upload Release Artifact / Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: AudioSplitter-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
